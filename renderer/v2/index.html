<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Agent 运维工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg aria-hidden="true" class="svg-sprite">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol><symbol id="i-plug" viewBox="0 0 24 24"><path d="M8 12h8M9 4v5M15 4v5M7 9h10v3a5 5 0 0 1-5 5v3M9 20h6"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h5M9 13h6M9 17h6"/></symbol><symbol id="i-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2-5.3L3 9M3 4v5h5M12 8v5l3 2"/></symbol><symbol id="i-server" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M8 7h.01M8 17h.01M12 7h5M12 17h5"/></symbol><symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></symbol><symbol id="i-redis" viewBox="0 0 24 24"><path d="m4 8 8-4 8 4-8 4zM4 12l8 4 8-4M4 16l8 4 8-4"/></symbol><symbol id="i-route" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6h5a3 3 0 0 1 3 3v6a3 3 0 0 0 3 3M11 3l3 3-3 3"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10a2 2 0 0 0-3-3l-10 10zM14 7l3 3"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="i-loader" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol><symbol id="i-plan" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M8 12h8M12 8v8"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 20 6v6c0 5-3.4 8-8 10-4.6-2-8-5-8-10V6z"/><path d="m9 12 2 2 4-5"/></symbol><symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m7 11 5-5 5 5M12 6v12"/></symbol><symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="m7 13 5 5 5-5M12 18V6"/></symbol>
  </svg>
  <div id="app" class="app-shell">
    <aside class="project-rail" aria-label="业务项目"><div class="logo" title="Agent 运维工作台"><span class="logo-mark">RB</span></div><nav id="projectList" class="project-list"></nav><button id="createProjectButton" class="rail-button rail-add" title="新建项目" aria-label="新建项目"><svg class="icon"><use href="#i-plus"/></svg></button></aside>
    <header class="topbar"><strong id="projectTitle" class="project-title">选择项目</strong><nav id="environmentTabs" class="environment-tabs" aria-label="环境"></nav><div class="top-actions"><button id="addEnvironment" class="top-icon" title="新建环境" aria-label="新建环境"><svg class="icon"><use href="#i-plus"/></svg></button><button id="manageEnvironments" class="top-icon" title="管理环境" aria-label="管理环境"><svg class="icon"><use href="#i-more"/></svg></button></div><div class="top-spacer"></div><div id="environmentRuntime" class="environment-runtime hidden"><span id="environmentStatus" class="runtime-status" data-state="disconnected">未连接</span><button id="environmentAction" class="button small primary">连接环境</button><button id="environmentDisconnect" class="text-button hidden">断开</button></div></header>
    <nav class="page-tabs" aria-label="项目功能"><button class="page-tab active" data-view="plugins"><svg class="icon"><use href="#i-plug"/></svg>插件</button><button class="page-tab" data-view="runbook"><svg class="icon"><use href="#i-file"/></svg>运维说明</button><button class="page-tab" data-view="audit"><svg class="icon"><use href="#i-history"/></svg>操作记录</button></nav>
    <main class="workspace">
      <section id="emptyState" class="empty-state"><div><div class="empty-mark">RB</div><h1>创建或选择一个业务项目</h1><p>项目中的环境、插件和运维说明彼此隔离。</p><button class="button primary" data-action="new-project">新建项目</button></div></section>
      <section id="pluginsView" class="view plugin-shell hidden"><aside class="plugin-panel"><div class="plugin-panel-head"><h2>插件 <span id="pluginCount"></span></h2><button id="addPlugin" class="square-button" title="添加插件" aria-label="添加插件"><svg class="icon"><use href="#i-plus"/></svg></button></div><div id="pluginList" class="plugin-list"></div></aside><article id="pluginDetail" class="plugin-detail"></article></section>
      <section id="runbookView" class="view document-view hidden"><div class="page-shell"><header class="page-head"><svg class="page-icon"><use href="#i-file"/></svg><div><h1 id="runbookTitle">运维说明</h1><p id="runbookScope"></p></div><div class="page-actions"><button id="cancelRunbook" class="button hidden">取消</button><button id="editRunbook" class="button primary">编辑</button><button id="saveRunbook" class="button primary hidden">保存</button></div></header><article id="runbookPreview" class="runbook-document"></article><textarea id="runbookEditor" class="runbook-editor hidden" spellcheck="false" aria-label="当前环境运维说明"></textarea></div></section>
      <section id="auditView" class="view audit-view hidden"><div class="page-shell"><header class="page-head"><svg class="page-icon"><use href="#i-history"/></svg><div><h1 id="auditTitle">操作记录</h1><p>只展示用户操作和重要结果；内部连接明细已自动合并</p></div><div class="page-actions"><button id="refreshAudit" class="button">刷新</button></div></header><div class="audit-tools"><input id="auditSearch" class="control search-control" placeholder="搜索操作或对象" aria-label="搜索操作记录"><select id="auditResult" class="control" aria-label="筛选结果"><option value="">全部结果</option><option value="success">成功</option><option value="warning">部分成功</option><option value="blocked">已拦截</option><option value="error">失败</option></select></div><div class="audit-table-wrap"><table><thead><tr><th>时间</th><th>操作</th><th>对象</th><th>结果</th><th>说明</th></tr></thead><tbody id="auditBody"></tbody></table><div id="auditEmpty" class="table-empty hidden">没有符合条件的操作记录</div></div></div></section>
    </main>
  </div>

  <dialog id="projectDialog"><form class="dialog-card" novalidate><div class="dialog-head"><h2>新建项目</h2><button type="button" class="square-button dialog-close" data-close="projectDialog" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button></div><div class="dialog-body form-grid"><label class="field full">项目名称<input id="projectName" required maxlength="120" placeholder="例如：会员服务"><span class="field-error" data-error-for="projectName"></span></label><label class="field full">第一个环境<input id="firstEnvironmentName" required maxlength="120" placeholder="例如：华东正式"><span class="field-error" data-error-for="firstEnvironmentName"></span></label></div><div class="dialog-actions"><button type="button" class="button" data-close="projectDialog">取消</button><button id="saveProject" type="submit" class="button primary">创建项目</button></div></form></dialog>
  <dialog id="environmentManagerDialog"><div class="dialog-card manager-card"><div class="dialog-head"><div><h2>管理环境</h2><p id="environmentManagerScope"></p></div><button id="managerAddEnvironment" class="button small manager-head-action"><svg class="icon"><use href="#i-plus"/></svg>新建环境</button><button class="square-button dialog-close" data-close="environmentManagerDialog" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button></div><div id="environmentManagerList" class="dialog-body environment-manager-list"></div></div></dialog>
  <dialog id="environmentDialog"><form class="dialog-card compact" novalidate><div class="dialog-head"><h2 id="environmentDialogTitle">新增环境</h2><button type="button" class="square-button dialog-close" data-close="environmentDialog" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button></div><div class="dialog-body"><label class="field">环境名称<input id="environmentName" required maxlength="120" autocomplete="off"><span class="field-error" data-error-for="environmentName"></span></label></div><div class="dialog-actions"><button type="button" class="button" data-close="environmentDialog">取消</button><button id="saveEnvironment" type="submit" class="button primary">保存</button></div></form></dialog>
  <dialog id="pluginDialog"><form class="dialog-card plugin-card" novalidate><div class="dialog-head"><svg class="icon"><use href="#i-plug"/></svg><div><h2 id="pluginDialogTitle">添加插件</h2><p id="pluginDialogScope"></p></div><button type="button" class="square-button dialog-close" data-close="pluginDialog" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button></div><div class="dialog-body"><div class="choice-grid"><label class="type-choice"><input type="radio" name="pluginTypeChoice" value="server"><span><strong>Server</strong><small>运维、日志与隧道</small></span></label><label class="type-choice"><input type="radio" name="pluginTypeChoice" value="mysql"><span><strong>MySQL</strong><small>固定一个数据库</small></span></label><label class="type-choice"><input type="radio" name="pluginTypeChoice" value="redis"><span><strong>Redis</strong><small>固定一个逻辑 DB</small></span></label></div><select id="pluginType" class="sr-only" aria-hidden="true"><option value="server">Server</option><option value="mysql">MySQL</option><option value="redis">Redis</option></select><div class="form-grid">
    <label class="field full">插件名称<input id="pluginDisplayName" required maxlength="120"><span class="field-error"></span></label><label class="field">主机地址<input id="pluginHost" maxlength="255" placeholder="127.0.0.1"><span class="field-error"></span></label><label class="field">端口<input id="pluginPort" type="number" min="1" max="65535"><span class="field-error"></span></label><div id="databaseField" class="field full"><span>数据库</span><span class="database-picker"><select id="pluginDatabase" aria-label="数据库" disabled><option value="">先填写连接信息并查询</option></select><button id="queryDatabases" type="button" class="button">查询数据库</button></span><span id="databaseHint" class="field-hint">只显示当前账号实际可见的普通数据库</span></div><label id="redisDbField" class="field full hidden">Logical DB<input id="pluginRedisDb" type="number" min="0" max="15" value="0"><span class="field-error"></span></label><label class="field">用户名<input id="pluginUsername" maxlength="128"><span class="field-error"></span></label><label class="field">密码<input id="pluginPassword" type="password" autocomplete="new-password" placeholder="留空保持已保存凭据"><span class="field-error"></span></label><label class="field full">地址族<select id="pluginAddressFamily"><option value="ipv4Preferred">IPv4 优先，失败尝试 IPv6</option><option value="ipv4Only">仅 IPv4</option><option value="ipv6Preferred">IPv6 优先，失败尝试 IPv4</option><option value="ipv6Only">仅 IPv6</option></select><span class="field-error"></span></label><label id="transportField" class="field">连接方式<select id="pluginTransport"><option value="direct">直接连接</option><option value="serverTunnel">复用同环境 Server 隧道</option><option value="windowsVpn">Windows VPN</option></select><span class="field-error"></span></label><label id="providerField" class="field hidden">复用的 Server<select id="pluginProvider"></select><span class="field-error"></span></label><label id="vpnField" class="field full hidden">VPN 网卡名称<input id="pluginVpnAlias"><span class="field-error"></span></label><label id="authTypeField" class="field">认证方式<select id="pluginAuthType"><option value="password">密码</option><option value="privateKey">私钥</option><option value="agent">SSH Agent</option></select><span class="field-error"></span></label><label id="privateKeyField" class="field hidden">私钥文件<input id="pluginPrivateKeyPath" placeholder="C:\Users\you\.ssh\id_ed25519"><span class="field-error"></span></label><label id="uplinkField" class="field">Server 上行方式<select id="pluginUplink"><option value="direct">直接连接</option><option value="socks5">SOCKS5</option><option value="http">HTTP CONNECT</option><option value="windowsVpn">Windows VPN</option></select><span class="field-error"></span></label><label id="proxyHostField" class="field hidden">代理地址<input id="pluginProxyHost" placeholder="127.0.0.1"><span class="field-error"></span></label><label id="proxyPortField" class="field hidden">代理端口<input id="pluginProxyPort" type="number" min="1" max="65535"><span class="field-error"></span></label><label id="proxyUsernameField" class="field hidden">代理用户名<input id="pluginProxyUsername"><span class="field-error"></span></label><label id="proxyPasswordField" class="field hidden">代理密码<input id="pluginProxyPassword" type="password" autocomplete="new-password"><span class="field-error"></span></label><label id="serverVpnField" class="field full hidden">VPN 网卡名称<input id="pluginServerVpnAlias"><span class="field-error"></span></label><label id="tlsField" class="field full">TLS<select id="pluginTls"><option value="disabled">关闭</option><option value="preferred">优先</option><option value="required">必须</option><option value="verifyIdentity">校验证书身份</option></select><span class="field-error"></span></label>
  </div></div><div id="pluginDialogError" class="dialog-inline-error hidden" role="alert"></div><div class="dialog-actions"><button id="deletePluginButton" type="button" class="button danger hidden" data-action="delete-plugin">删除插件</button><span class="dialog-action-spacer"></span><button type="button" class="button" data-close="pluginDialog">取消</button><button id="savePlugin" type="submit" class="button primary">保存插件</button></div></form></dialog>
  <dialog id="diagnosticDialog" class="compact-dialog"><div class="dialog-card compact"><div class="dialog-head"><svg class="icon"><use href="#i-route"/></svg><div><h2 id="diagnosticTitle">连接检查</h2><p id="diagnosticScope"></p></div><button class="square-button dialog-close" data-close="diagnosticDialog" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button></div><div class="dialog-body diagnostic-body"><div id="diagnosticList" class="diagnostic-list"></div><div id="diagnosticSummary" class="diagnostic-summary"></div></div><div class="dialog-actions"><button class="button primary" data-close="diagnosticDialog">完成</button></div></div></dialog>
  <dialog id="confirmationDialog"><div class="dialog-card"><div class="dialog-head"><h2>等待确认的操作</h2><button class="square-button dialog-close" data-close="confirmationDialog" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button></div><div id="confirmationList" class="dialog-body"></div></div></dialog><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><script type="module" src="app.js"></script>
</body>
</html>
