<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>AI 运维工具</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">≋</span>AI 运维工具</div>
        <div class="section-label">项目</div>
        <div id="project-list" class="project-list"></div>
        <button id="new-project" class="primary sidebar-button">＋ 新建项目</button>
        <button id="open-data" class="icon-button" title="打开数据目录">⚙</button>
      </aside>

      <main class="workspace">
        <section id="empty-state" class="empty-state">
          <div class="empty-icon">⌁</div>
          <h1>创建第一个运维项目</h1>
          <p>配置 SSH 连接并编写 Markdown，之后就可以让 Codex 使用当前会话。</p>
          <button class="primary" data-action="new-project">新建项目</button>
        </section>

        <section id="project-view" class="project-view hidden">
          <header class="project-header">
            <div>
              <div class="title-row">
                <h1 id="project-name"></h1>
                <span id="connection-badge" class="badge disconnected">未连接</span>
              </div>
              <div id="server-address" class="server-address"></div>
            </div>
            <div class="project-actions">
              <button id="edit-project" class="outline subtle">连接设置</button>
              <button id="delete-project" class="text-danger">删除项目</button>
              <button id="connection-button" class="outline">连接</button>
            </div>
          </header>

          <nav class="doc-tabs">
            <div id="doc-tab-list" class="doc-tab-list"></div>
            <button id="add-document" class="add-tab" title="新增 Markdown">＋</button>
          </nav>

          <section class="editor-toolbar">
            <div class="view-switch">
              <button id="edit-mode" class="active">编辑</button>
              <button id="preview-mode">预览</button>
            </div>
            <div class="toolbar-actions">
              <span id="document-save-state" class="document-save-state hidden">未保存</span>
              <button id="delete-document" class="text-danger hidden">删除文档</button>
              <button id="save-document" class="primary">保存</button>
            </div>
          </section>

          <section class="editor-area">
            <textarea id="document-editor" spellcheck="false"></textarea>
            <article id="document-preview" class="markdown-preview hidden"></article>
          </section>

          <section id="codex-status" class="codex-status disconnected">
            <div class="shield">✓</div>
            <div>
              <strong>Codex 当前不能操作服务器</strong>
              <span>在桌面工具中连接项目后即可使用</span>
            </div>
          </section>
        </section>
      </main>

      <footer class="status-bar">
        <span><i class="status-dot"></i>MCP 可用</span>
        <span>登录凭据由 Windows 加密保存，不通过 MCP 提供给 Codex · <span id="app-version"></span></span>
      </footer>
    </div>

    <dialog id="project-dialog" class="project-dialog">
      <form id="project-form" method="dialog">
        <div class="dialog-header">
          <h2 id="dialog-title">新建项目</h2>
          <button type="button" id="close-dialog" class="close-button">×</button>
        </div>
        <div class="form-grid">
          <label class="full">项目名称<input name="name" required placeholder="订单系统生产" /></label>
          <label class="server-field">服务器<input name="host" required placeholder="192.168.10.20" /></label>
          <label class="port-field">端口<input name="port" type="number" min="1" max="65535" value="22" required /></label>
          <label class="full">用户名<input name="username" required placeholder="order-deploy" /></label>
          <label class="full">登录方式
            <select name="authType" id="auth-type">
              <option value="password">密码登录</option>
              <option value="privateKey">SSH 私钥文件</option>
              <option value="agent">Windows SSH Agent</option>
            </select>
          </label>
          <label id="password-row" class="full">密码<input name="password" type="password" autocomplete="off" placeholder="仅用于本次连接" /></label>
          <div id="private-key-row" class="full hidden">
            <label>私钥文件
              <div class="input-with-button"><input name="privateKeyPath" placeholder="C:\Users\me\.ssh\id_ed25519" /><button id="choose-key" type="button">选择</button></div>
            </label>
            <label>私钥口令<input name="privateKeyPassphrase" type="password" autocomplete="off" placeholder="没有口令可留空" /></label>
          </div>
          <label class="full remember-row">
            <input name="rememberCredentials" type="checkbox" checked />
            <span>记住登录凭据，使用 Windows 加密存储以便一键重连</span>
          </label>
        </div>

        <details id="advanced-options" class="advanced-options">
          <summary>高级设置</summary>
          <div class="form-grid advanced-grid">
            <label class="full">连接方式
              <select name="proxyType" id="proxy-type">
                <option value="direct">直接连接</option>
                <option value="socks5">SOCKS5 代理</option>
                <option value="http">HTTP CONNECT 代理</option>
              </select>
            </label>
            <div id="proxy-fields" class="full form-grid hidden">
              <label class="server-field">代理地址<input name="proxyHost" placeholder="127.0.0.1" /></label>
              <label class="port-field">端口<input name="proxyPort" type="number" min="1" max="65535" value="1080" /></label>
              <label class="full">代理用户<input name="proxyUsername" placeholder="可选" /></label>
              <label class="full">代理密码<input name="proxyPassword" type="password" autocomplete="off" placeholder="连接时输入，可选" /></label>
              <label class="switch-row"><input name="remoteDns" type="checkbox" checked /><span>远程 DNS</span></label>
            </div>
            <div class="full policy-divider"></div>
            <label class="switch-row policy-toggle">
              <input name="commandPolicyEnabled" type="checkbox" checked />
              <span>启用危险命令拦截（推荐）</span>
            </label>
            <label class="full policy-phrases">额外阻止短语
              <textarea name="customDeny" rows="3" maxlength="10049" placeholder="每行一条，例如：docker system prune"></textarea>
            </label>
            <p class="full policy-help">内置规则会拦截删除文件、提权、重启主机、修改用户、磁盘、网络下载等高危操作。额外短语按忽略大小写的字面内容匹配。</p>
          </div>
        </details>

        <div id="credential-storage-note" class="security-note">▣ 凭据由 Windows 加密保存，不会通过 MCP 提供给 Codex</div>
        <div id="dialog-error" class="dialog-error hidden"></div>
        <div class="dialog-actions">
          <button type="button" id="cancel-dialog">取消</button>
          <button type="submit" id="submit-project" class="primary">创建并连接</button>
        </div>
      </form>
    </dialog>

    <dialog id="document-dialog" class="small-dialog">
      <form id="document-form">
        <div class="dialog-header">
          <h2>新增 Markdown 文档</h2>
          <button type="button" id="close-document-dialog" class="close-button">×</button>
        </div>
        <label class="stacked-field">文档名称
          <input id="document-name" name="documentName" required maxlength="120" placeholder="例如 DEPLOY.md" />
        </label>
        <div id="document-dialog-error" class="dialog-error hidden"></div>
        <div class="dialog-actions">
          <button type="button" id="cancel-document-dialog">取消</button>
          <button id="submit-document" type="submit" class="primary">创建</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast hidden"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
