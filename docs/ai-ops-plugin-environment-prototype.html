"providerField" class="field hidden">复用的 Server<select id="pluginProvider"></select><span class="field-error"></span></label><label id="vpnField" class="field full hidden">VPN 网卡名称<input id="pluginVpnAlias"><span class="field-error"></span></label><label id="authTypeField" class="field">认证方式<select id="pluginAuthType"><option value="password">密码</option><option value="privateKey">私钥</option><option value="agent">SSH Agent</option></select><span class="field-error"></span></label><label id="privateKeyField" class="field hidden">私钥文件<input id="pluginPrivateKeyPath" placeholder="C:\Users\you\.ssh\id_ed25519"><span class="field-error"></span></label><label id="uplinkField" class="field">Server 上行方式<select id="pluginUplink"><option value="direct">直接连接</option><option value="socks5">SOCKS5</option><option value="http">HTTP CONNECT</option><option value="windowsVpn">Windows VPN</option></select><span class="field-error"></span></label><label id="proxyHostField" class="field hidden">代理地址<input id="pluginProxyHost" placeholder="127.0.0.1"><span class="field-error"></span></label><label id="proxyPortField" class="field hidden">代理端口<input id="pluginProxyPort" type="number" min="1" max="65535"><span class="field-error"></span></label><label id="proxyUsernameField" class="field hidden">代理用户名<input id="pluginProxyUsername"><span class="field-error"></span></label><label id="proxyPasswordField" class="field hidden">代理密码<span class="password-control"><input id="pluginProxyPassword" type="password" autocomplete="new-password" placeholder="请输入代理密码"><button type="button" class="password-toggle" data-password-target="pluginProxyPassword" aria-label="显示密码" title="显示密码"><svg class="icon"><use href="#i-eye"/></svg></button></span><span class="field-error"></span></label><label id="serverVpnField" class="field full hidden">VPN 网卡名称<input id="pluginServerVpnAlias"><span class="field-error"></span></label><label id="tlsField" class="field full">TLS<select id="pluginTls"><option value="disabled">关闭</option><option value="preferred">优先</option><option value="required">必须</option><option value="verifyIdentity">校验证书身份</option></select><span class="field-error"></span></label>

  <dialog id="deletePluginDialog" class="compact-dialog"><div class="dialog-card compact"><div class="dialog-head"><svg class="icon danger-icon"><use href="#i-trash"/></svg><div><h2>删除插件</h2><p id="deletePluginScope"></p></div><button class="square-button dialog-close" data-close="deletePluginDialog" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button></div><div class="dialog-body"><p id="deletePluginMessage" class="delete-message"></p><div id="deletePluginBlockers" class="delete-blockers hidden"></div></div><div class="dialog-actions"><button class="button" data-close="deletePluginDialog">取消</button><button id="confirmDeletePlugin" class="button danger">删除插件</button></div></div></dialog>
  <dialog id="confirmationDialog"><div class="dialog-card"><div class="dialog-head"><div><h2>Agent 操作确认</h2><p>只确认下面这一项操作；内容变化后需要重新确认</p></div><button class="square-button dialog-close" data-close="confirmationDialog" aria-label="关闭"><svg class="icon"><use href="#i-x"/></svg></button></div><div id="confirmationList" class="dialog-body confirmation-list"></div></div></dialog><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><div class="prototype-badge">当前项目原型 · 模拟连接</div><script>(function () {
  const clone = (value) => structuredClone(value);
  const ok = (data) => Promise.resolve({ ok: true, data: clone(data) });
  const failure = (code, message, details) => Promise.resolve({ ok: false, error: { code, message, details } });
  const now = () => new Date().toISOString();
  const workspaceOrderStorageKey = 'ai-ops-prototype-workspace-order-v1';
  const emitter = { status: new Set(), workspace: new Set(), confirmations: new Set() };

  const projectNames = [
    '菲律宾-icharge', '荷兰-voltstaion', '利比亚-zwad', '美国-万城通', '摩洛哥-chargiw',
    '企业版生产环境', '日本-测试机', '泰国-hippo', '希腊-zeus', '越南-soltech',
  ];
  const projects = projectNames.map((name, index) => ({
    schemaVersion: 2,
    projectId: `project-${index + 1}`,
    name,
    revision: 1,
    environmentCount: name === '日本-测试机' ? 2 : 1,
    pluginCount: name === '日本-测试机' ? 3 : (index < 5 ? 2 : 1),
  }));
  const environments = Object.fromEntries(projects.map((project, projectIndex) => {
    const primary = {
      projectId: project.projectId,
      environmentId: `${project.projectId}-primary`,
      name: project.name === '日本-测试机' ? '测试环境1' : (project.name === '菲律宾-icharge' ? '生产环境' : '默认环境'),
      revision: 1,
      pluginCount: project.pluginCount - (project.name === '日本-测试机' ? 1 : 0),
      readyPluginCount: project.pluginCount - (project.name === '日本-测试机' ? 1 : 0),
    };
    const items = [primary];
    if (project.name === '日本-测试机') items.push({
      projectId: project.projectId,
      environmentId: `${project.projectId}-production`,
      name: '生产环境', revision: 1, pluginCount: 1, readyPluginCount: 0,
    });
    return [project.projectId, items];
  }));
  const philippines = projects[0];
  philippines.environmentCount = 2;
  philippines.pluginCount = 4;
  const philippinesStaging = {
    projectId: philippines.projectId,
    environmentId: `${philippines.projectId}-staging`,
    name: '预发布环境', revision: 1, pluginCount: 2, readyPluginCount: 2,
  };
  environments[philippines.projectId].push(philippinesStaging);

  function makeServer(projectId, environmentId, suffix, host, name = '应用服务器') {
    return {
      projectId, environmentId, pluginInstanceId: `server-${suffix}`, pluginType: 'server',
      displayName: name, revision: 1, configState: 'ready',
      target: { host, port: 22, addressFamily: 'ipv4Preferred', hostKeyFingerprint: 'SHA256:7cb2…a91f' },
      auth: { username: 'deploy', type: 'password' }, uplink: { type: 'direct' }, sources: [],
      policy: { status: 'auto', diagnostics: 'auto', logs: 'auto', config: 'confirm', download: 'confirm' },
      limits: { maxBytes: 262144 },
    };
  }
  function makeMySql(projectId, environmentId, suffix, database, serverId, name = '业务数据库') {
    return {
      projectId, environmentId, pluginInstanceId: `mysql-${suffix}`, pluginType: 'mysql',
      displayName: name, revision: 1, configState: 'ready',
      target: { host: '127.0.0.1', port: 3306, database, addressFamily: 'ipv4Preferred' },
      auth: { username: 'reader' }, transport: { kind: 'serverTunnel', serverPluginInstanceId: serverId },
      tls: { mode: 'disabled' }, policy: { describe: 'auto', select: 'auto', explain: 'auto' },
      limits: { maxRows: 100, maxBytes: 1048576, timeoutMs: 10000 },
    };
  }
  function makeRedis(projectId, environmentId, suffix, serverId, name = '会话缓存') {
    return {
      projectId, environmentId, pluginInstanceId: `redis-${suffix}`, pluginType: 'redis',
      displayName: name, revision: 1, configState: 'ready',
      target: { host: '127.0.0.1', port: 6379, db: 2, addressFamily: 'ipv4Preferred' },
      auth: { username: '' }, transport: { kind: 'serverTunnel', serverPluginInstanceId: serverId },
      tls: { mode: 'disabled' }, patterns: [{ patternId: 'session', pattern: 'session:*' }],
      policy: { scan: 'auto', read: 'auto', ttl: 'auto' },
      limits: { maxKeys: 100, maxValueBytes: 65536, timeoutMs: 5000 },
    };
  }

  const plugins = {};
  projects.forEach((project, index) => {
    const environment = environments[project.projectId][0];
    const suffix = `${index + 1}`;
    const server = makeServer(project.projectId, environment.environmentId, suffix, `10.${20 + index}.8.16`);
    const items = [server];
    if (environment.pluginCount > 1) items.push(makeMySql(project.projectId, environment.environmentId, suffix, `app_${suffix}`, server.pluginInstanceId, '业务主库'));
    plugins[environment.environmentId] = items;
  });
  const philippinesStagingServer = makeServer(philippines.projectId, philippinesStaging.environmentId, 'philippines-staging', '10.20.9.18', '预发布服务器');
  plugins[philippinesStaging.environmentId] = [
    philippinesStagingServer,
    makeRedis(philippines.projectId, philippinesStaging.environmentId, 'philippines-staging', philippinesStagingServer.pluginInstanceId, '预发布缓存'),
  ];
  const japan = projects.find((item) => item.name === '日本-测试机');
  const japanTest = environments[japan.projectId][0];
  const japanServer = makeServer(japan.projectId, japanTest.environmentId, 'japan', '64.81.112.37');
  plugins[japanTest.environmentId] = [japanServer, makeMySql(japan.projectId, japanTest.environmentId, 'japan', 'db_solpower_test', japanServer.pluginInstanceId, '测试数据库')];
  const japanProduction = environments[japan.projectId][1];
  plugins[japanProduction.environmentId] = [{
    projectId: japan.projectId, environmentId: japanProduction.environmentId,
    pluginInstanceId: 'mysql-japan-production', pluginType: 'mysql', displayName: '生产数据库',
    revision: 1, configState: 'draft', target: { host: '', port: 3306, database: '', addressFamily: 'ipv4Preferred' },
    auth: { username: '' }, transport: { kind: 'direct' }, tls: { mode: 'disabled' },
    policy: { describe: 'auto', select: 'auto', explain: 'auto' }, limits: { maxRows: 100, maxBytes: 1048576, timeoutMs: 10000 },
  }];

  const runtimes = {};
  Object.values(environments).flat().forEach((environment) => {
    const eligible = (plugins[environment.environmentId] || []).filter((item) => item.configState === 'ready');
    const connected = environment.environmentId === japanTest.environmentId;
    runtimes[environment.environmentId] = {
      projectId: environment.projectId, environmentId: environment.environmentId,
      desiredConnected: connected, phase: connected ? 'connected' : 'disconnected',
      eligibleCount: eligible.length, connectedCount: connected ? eligible.length : 0,
      errorCount: 0, blockedCount: 0,
      plugins: Object.fromEntries(eligible.map((item) => [item.pluginInstanceId, {
        pluginInstanceId: item.pluginInstanceId, phase: connected ? 'connected' : 'disconnected',
      }])),
    };
  });

  // Cross-project samples are local state only. They let the clickable
  // prototype demonstrate healthy, degraded and reconnecting projects.
  const seedRuntime = (projectIndex, phase, pluginPhases) => {
    const project = projects[projectIndex];
    const environment = environments[project.projectId][0];
    const runtime = runtimes[environment.environmentId];
    runtime.desiredConnected = true;
    runtime.phase = phase;
    Object.entries(pluginPhases).forEach(([pluginInstanceId, value]) => {
      runtime.plugins[pluginInstanceId] = { pluginInstanceId, ...value };
    });
    runtime.connectedCount = Object.values(runtime.plugins).filter((item) => item.phase === 'connected').length;
    runtime.errorCount = Object.values(runtime.plugins).filter((item) => item.phase === 'error').length;
    runtime.blockedCount = Object.values(runtime.plugins).filter((item) => item.phase === 'blocked').length;
  };
  const philippinesPlugins = plugins[environments[projects[0].projectId][0].environmentId];
  seedRuntime(0, 'partial', {
    [philippinesPlugins[0].pluginInstanceId]: { phase: 'connected' },
    [philippinesPlugins[1].pluginInstanceId]: { phase: 'error', reason: 'MYSQL_CONNECTION_TIMEOUT', error: { message: 'MySQL 连接超时' } },
  });
  const philippinesStagingRuntime = runtimes[philippinesStaging.environmentId];
  philippinesStagingRuntime.desiredConnected = true;
  philippinesStagingRuntime.phase = 'connected';
  philippinesStagingRuntime.connectedCount = philippinesStagingRuntime.eligibleCount;
  Object.values(philippinesStagingRuntime.plugins).forEach((item) => { item.phase = 'connected'; });
  const netherlandsPlugins = plugins[environments[projects[1].projectId][0].environmentId];
  seedRuntime(1, 'reconnecting', {
    [netherlandsPlugins[0].pluginInstanceId]: { phase: 'reconnecting', reason: 'NETWORK_CHANGED' },
    [netherlandsPlugins[1].pluginInstanceId]: { phase: 'blocked', reason: 'NETWORK_CHANGED' },
  });
  const libyaPlugins = plugins[environments[projects[2].projectId][0].environmentId];
  seedRuntime(2, 'failed', {
    [libyaPlugins[0].pluginInstanceId]: { phase: 'error', reason: 'SERVER_UNREACHABLE', error: { message: '服务器暂时无法访问' } },
    [libyaPlugins[1].pluginInstanceId]: { phase: 'blocked', reason: 'SERVER_UNREACHABLE' },
  });

  const runbooks = Object.fromEntries(Object.values(environments).flat().map((environment) => [
    environment.environmentId,
    `# ${environment.name}\n\n## 服务说明\n\n在这里记录该环境的部署方式、日志位置和排障步骤。\n\n## 安全约束\n\n优先执行只读检查，变更操作必须经过人工确认。`,
  ]));
  const audits = Object.fromEntries(Object.values(environments).flat().map((environment) => [environment.environmentId, [
    { id: `${environment.environmentId}-1`, time: now(), type: 'environment-connected', actor: 'user', operation: '连接环境', target: environment.name, result: 'success', connectedCount: runtimes[environment.environmentId].connectedCount, eligibleCount: runtimes[environment.environmentId].eligibleCount, detail: `${runtimes[environment.environmentId].connectedCount}/${runtimes[environment.environmentId].eligibleCount} 个插件已连接` },
    { id: `${environment.environmentId}-2`, time: new Date(Date.now() - 3600000).toISOString(), type: 'plugin-operation', actor: 'agent', capability: 'status', pluginInstanceId: (plugins[environment.environmentId] || [])[0]?.pluginInstanceId, pluginNameSnapshot: (plugins[environment.environmentId] || [])[0]?.displayName, result: 'success', detail: '只读检查已完成' },
  ]]));

  let sequence = 100;
  const findProject = (id) => projects.find((item) => item.projectId === id);
  const findEnvironment = (projectId, environmentId) => (environments[projectId] || []).find((item) => item.environmentId === environmentId);
  const emitStatus = (runtime) => emitter.status.forEach((callback) => callback(clone(runtime)));
  const emitWorkspace = (payload) => emitter.workspace.forEach((callback) => callback(clone(payload)));

  function runtimeFor(environmentId) { return runtimes[environmentId]; }

  else if (runtime.phase === 'connecting') action.textContent = '取消';
  else if (runtime.phase === 'connected') action.textContent = '断开环境';

function fixedRules(plugin) {

function renderMarkdown(source) {
  const lines = String(source ?? '').split(/\r?\n/);
  const output = [];
  let list = false;
  for (const line of lines) {
    if (line.startsWith('# ')) { if (list) { output.push('</ul>'); list = false; } output.push(`<h1>${escapeHtml(line.slice(2))}</h1>`); continue; }
    if (line.startsWith('## ')) { if (list) { output.push('</ul>'); list = false; } output.push(`<h2>${escapeHtml(line.slice(3))}</h2>`); continue; }
    if (line.startsWith('- ')) { if (!list) { output.push('<ul>'); list = true; } output.push(`<li>${escapeHtml(line.slice(2))}</li>`); continue; }
    if (list) { output.push('</ul>'); list = false; }
    if (line.trim()) output.push(`<p>${escapeHtml(line)}</p>`);
  }
  if (list) output.push('</ul>');
  return output.join('') || '<p class="muted">暂未填写运维说明</p>';
}

function auditResult(entry) {

}

}
function auditCapabilityName(value) {
  return ({status:'查看系统状态',diagnostics:'运行安全诊断',logs:'查询日志',config:'查看配置',download:'下载文件',describe:'查看表结构',select:'查询数据',explain:'查看执行计划',scan:'扫描缓存键',read:'读取缓存',ttl:'查看过期时间'})[value] ?? value;
}
function auditErrorName(value) {

}
function auditActorName(entry) {
  if (entry.actor === 'agent' || entry.type === 'plugin-operation' || entry.type === 'policy-denied' || entry.type === 'mysql-query') return 'Agent';
  if (entry.actor === 'system' || entry.type === 'auto-reconnect' || entry.result === 'connection-lost') return '系统';
  return '用户';
}
function auditOperationName(entry) {
  if (entry.type === 'plugin-added') return '添加插件';
  if (entry.type === 'plugin-connected') return '连接插件';
  if (entry.type === 'plugin-disconnected') return '断开插件';
  if (entry.type === 'plugin-policy-updated') return '修改 Agent 权限';
  if (entry.type === 'runbook-updated') return '更新运维说明';
  if (entry.type === 'confirmation-approved') return '确认 Agent 操作';
  if (entry.type === 'confirmation-rejected') return '拒绝 Agent 操作';
  if (entry.type === 'plugin-operation-decision') return auditCapabilityName(entry.capability ?? 'Agent 操作');
  if (entry.type === 'environment-disconnected') return '断开环境';
  if (entry.type?.startsWith('environment-')) return '连接环境';
  if (entry.type === 'host-key-change-approved') return '确认服务器指纹';
  if (entry.type === 'auto-reconnect') return '自动恢复连接';
  if (entry.type === 'disconnect' && entry.result === 'connection-lost') return '连接意外中断';
  if (entry.type === 'plugin-operation') return auditCapabilityName(entry.capability ?? entry.operation ?? '执行插件操作');
  return auditCapabilityName(entry.operation ?? entry.capability ?? ({'mysql-query':'查询数据','policy-denied':'操作被规则拦截'})[entry.type] ?? '未知操作');

function auditDescription(entry) {

function resetPluginFormTransition() {
  pluginFormTransitionGeneration += 1;
  clearTimeout(pluginFormTransitionTimer);
  pluginFormTransitionTimer = null;
  const grid = $('#pluginFormGrid');
  grid?.classList.remove('form-switch-out','form-switch-in');
}

function transitionPluginForm(update) {
  const dialog = $('#pluginDialog');
  const grid = $('#pluginFormGrid');
  const body = $('.plugin-dialog-body', dialog);
  if (!dialog.open || !grid || !body || matchMedia('(prefers-reduced-motion: reduce)').matches) {
    update();
    return;
  }
  const generation = ++pluginFormTransitionGeneration;
  clearTimeout(pluginFormTransitionTimer);
  const scrollTop = body.scrollTop;
  grid.classList.remove('form-switch-in');
  grid.classList.add('form-switch-out');
  pluginFormTransitionTimer = setTimeout(() => {
    if (generation !== pluginFormTransitionGeneration) return;
    update();
    body.scrollTop = Math.min(scrollTop,Math.max(0,body.scrollHeight - body.clientHeight));
    grid.classList.remove('form-switch-out');
    void grid.offsetWidth;
    grid.classList.add('form-switch-in');
    pluginFormTransitionTimer = setTimeout(() => {
      if (generation === pluginFormTransitionGeneration) grid.classList.remove('form-switch-in');
    },160);
  },60);
}

function pluginFormSignature() {

async function queryDatabases() {
  const host = $('#pluginHost').value.trim();
  const port = Number($('#pluginPort').value);
  const username = $('#pluginUsername').value.trim();
  if (!host || !port || !username) throw new Error('请先填写主机地址、端口和用户名。');
  if ($('#pluginTransport').value === 'serverTunnel' && !$('#pluginProvider').value) throw new Error('请选择要复用的 Server 隧道。');
  const button = $('#queryDatabases');
  const saveButton = $('#savePlugin');
  const queryGeneration = ++state.databaseQueryGeneration;
  const dialogGeneration = state.credentialProbeGeneration;
  const requestedScope = { projectId:state.projectId, environmentId:state.environmentId, pluginInstanceId:state.editingPlugin?.pluginInstanceId ?? null };
  const requestedSignature = databaseConnectionSignature();
  clearPluginDialogError();
  button.disabled = true;
  saveButton.disabled = true;
  button.textContent = '查询中…';
  try {
    const input = {
      pluginType:'mysql', displayName:$('#pluginDisplayName').value.trim() || 'MySQL 数据库',
      target:{ host, port, database:'', addressFamily:$('#pluginAddressFamily').value },
      auth:{ username }, transport:{ kind:$('#pluginTransport').value }, tls:{ mode:$('#pluginTls').value },
    };
    if (input.transport.kind === 'serverTunnel') input.transport.serverPluginInstanceId = $('#pluginProvider').value;
    if (input.transport.kind === 'windowsVpn') input.transport.interfaceAlias = $('#pluginVpnAlias').value.trim();
    const password = editedPasswordValue('pluginPassword');
    const result = await call(api.listPluginDatabases({
      projectId:requestedScope.projectId, environmentId:requestedScope.environmentId,
      pluginInstanceId:state.editingPlugin?.pluginType === 'mysql' ? requestedScope.pluginInstanceId : null,
      input, secrets:password ? {password} : {},
    }));
    if (queryGeneration !== state.databaseQueryGeneration || dialogGeneration !== state.credentialProbeGeneration || !$('#pluginDialog').open || requestedScope.projectId !== state.projectId || requestedScope.environmentId !== state.environmentId || requestedScope.pluginInstanceId !== (state.editingPlugin?.pluginInstanceId ?? null) || requestedSignature !== databaseConnectionSignature()) return;
    const databases = result.databases ?? [];
    $('#pluginDatabase').innerHTML = databases.length
      ? `<option value="">请选择数据库</option>${databases.map((name) => `<option value="${escapeAttr(name)}">${escapeHtml(name)}</option>`).join('')}`
      : '<option value="">没有可选择的数据库</option>';
    $('#pluginDatabase').disabled = !databases.length;
    const previous = state.editingPlugin?.target?.database;
    if (previous && databases.includes(previous)) $('#pluginDatabase').value = previous;
    else if (databases.length === 1) $('#pluginDatabase').value = databases[0];
    state.databaseDiscoverySignature = requestedSignature;
    $('#databaseHint').textContent = databases.length ? `已查询到 ${databases.length} 个数据库${result.truncated ? '（仅显示前 200 个）' : ''}` : '当前账号没有可见的普通数据库';
  } finally {
    if (queryGeneration === state.databaseQueryGeneration) {
      button.disabled = false;
      saveButton.disabled = false;
      button.textContent = '查询数据库';
    }
  }
}

async function savePlugin() {
  const type = $('#pluginType').value;
  const input = { pluginType:type, displayName:$('#pluginDisplayName').value.trim(), target:{ host:$('#pluginHost').value.trim(), port:Number($('#pluginPort').value), addressFamily:$('#pluginAddressFamily').value }, auth:{ username:$('#pluginUsername').value.trim() } };
  if (!input.displayName) throw new Error('请填写插件名称。');
  if (type === 'server') {
    input.auth.type = $('#pluginAuthType').value;
    if (input.auth.type === 'privateKey') {
      input.auth.privateKeyPath = $('#pluginPrivateKeyPath').value.trim();
    }
    input.uplink = { type:$('#pluginUplink').value };
    if (['socks5','http'].includes(input.uplink.type)) {
      Object.assign(input.uplink,{host:$('#pluginProxyHost').value.trim(),port:Number($('#pluginProxyPort').value),username:$('#pluginProxyUsername').value.trim()});
    }
    if (input.uplink.type === 'windowsVpn') {
      input.uplink.interfaceAlias = $('#pluginServerVpnAlias').value.trim();
    }
    input.sources = state.editingPlugin?.sources ?? [];
  } else {
    input.transport = { kind:$('#pluginTransport').value };
    if (input.transport.kind === 'serverTunnel') {
      input.transport.serverPluginInstanceId = $('#pluginProvider').value;
    }
    if (input.transport.kind === 'windowsVpn') {
      input.transport.interfaceAlias = $('#pluginVpnAlias').value.trim();
    }
    input.tls = { mode:$('#pluginTls').value };
    if (type === 'mysql') {
      input.target.database = $('#pluginDatabase').value;
    } else input.target.db = Number($('#pluginRedisDb').value);
  }
  const primaryPassword = editedPasswordValue('pluginPassword');
  const proxyPassword = editedPasswordValue('pluginProxyPassword');
  const secrets = primaryPassword ? (type === 'server' && input.auth.type === 'privateKey' ? {privateKeyPassphrase:primaryPassword} : {password:primaryPassword}) : {};
  if (type === 'server' && proxyPassword) secrets.proxyPassword = proxyPassword;
  const scope = { projectId:state.projectId,environmentId:state.environmentId };
  const plugin = state.editingPlugin ? await call(api.updatePlugin({...scope,pluginInstanceId:state.editingPlugin.pluginInstanceId,patch:input,expectedRevision:state.editingPlugin.revision,secrets})) : await call(api.createPlugin({...scope,input,secrets}));
  $('#pluginDialog').close();
  await refreshEnvironmentMetadata();
  await loadEnvironment(plugin.pluginInstanceId);
  toast(plugin.configState === 'ready' ? '插件已保存；不会自动连接。' : '插件草稿已保存；补齐配置后才能连接。');
}

async function environmentAction() {
  const scope = { projectId:state.projectId,environmentId:state.environmentId };
  const phase = state.runtime?.phase ?? 'disconnected';
  if (!(state.runtime?.eligibleCount ?? 0) && !state.runtime?.desiredConnected) {
    if (!state.plugins.length) { openPluginDialog(); return; }
    const incomplete = state.plugins.find((plugin) => plugin.configState !== 'ready') ?? state.plugins[0];
    state.pluginId = incomplete.pluginInstanceId;
    state.scopePluginMemory[scopeKey()] = state.pluginId;
    renderPlugins();
    openPluginDialog(incomplete);
    return;
  }
  if (phase === 'connecting') state.runtime = await call(api.cancelEnvironment(scope));
  else if (phase === 'connected') state.runtime = await call(api.disconnectEnvironment(scope));
  else if (state.runtime?.desiredConnected) state.runtime = await call(api.retryEnvironment(scope));
  else {
    try {
      state.runtime = await call(api.connectEnvironment({...scope,expectedRevision:activeEnvironment().revision}));
    } catch (error) {
      if (error.code !== 'CONFIG_REVISION_CONFLICT') throw error;
      await refreshEnvironmentMetadata();
      state.runtime = await call(api.connectEnvironment({...scope,expectedRevision:activeEnvironment().revision}));
    }
  }
  renderShell();
}

function diagnosticScopeName(plugin) {
  if (plugin.pluginType === 'server') return '网络路由、SSH 认证与主机指纹';
  if (plugin.pluginType === 'mysql') return '连接路由、数据库认证与固定数据库';

}
function diagnosticRouteName(plugin) { return plugin.pluginType === 'server' ? uplinkName(plugin) : transportName(plugin); }
function diagnosticMarkup(plugin, status, reused = false) {

  const statusIcon = pending ? 'loader' : status === 'success' ? 'check' : 'x';
  return `<div class="diagnostic-state ${status}"><span class="diagnostic-state-icon">${icon(statusIcon)}</span><span><strong>${title}</strong><small>${subtitle}</small></span></div><dl class="diagnostic-facts"><dt>目标</dt><dd>${escapeHtml(pluginTarget(plugin))}</dd><dt>连接方式</dt><dd>${escapeHtml(diagnosticRouteName(plugin))}</dd><dt>${reused ? '结果依据' : '实际检查'}</dt><dd>${escapeHtml(reused ? '当前环境的活动连接状态' : diagnosticScopeName(plugin))}</dd></dl>`;
}

      manage.setAttribute('aria-label', `管理${projectById(projectId)?.name || '项目'}的环境`);
      const clip = document.createElement('div');
      clip.className = 'project-environment-clip';
      clip.innerHTML = '<div class="project-environment-list"></div>';
      projectList.insertBefore(tree, button);
      tree.append(head, clip);
      head.append(toggle, button, manage);
    });
    applyProjectOrder(projectList);
    const renderOrder = projectOrderForRender();
    document.querySelectorAll('.project-tree-item').forEach((tree) => {
      const button = tree.querySelector('.rail-button[data-project-id]');
      const projectId = button.dataset.projectId;
      const project = projectById(projectId);
      if (!project) return;
      const summary = projectSummary(projectId);
      const subtitle = projectSubtitle(summary);
      const copy = button.querySelector('.rail-project-copy small');
      if (copy) copy.textContent = subtitle;
      const tooltip = button.querySelector('.project-tooltip');
      if (tooltip) tooltip.textContent = `${project.name} · ${subtitle}`;
      button.querySelector('.project-runtime-indicator')?.remove();
      button.dataset.projectState = projectState(summary);
      button.title = `${project.name} · ${subtitle}`;
      tree.dataset.projectState = projectState(summary);
      tree.classList.toggle('active', button.classList.contains('active'));
      tree.classList.toggle('project-overview-current', button.classList.contains('active') && overviewActive);
      tree.classList.toggle('environment-current', button.classList.contains('active') && !overviewActive);
      tree.classList.toggle('expanded', expandedProjects.has(projectId));
      tree.dataset.sortIndex = String(renderOrder.indexOf(projectId));
      const toggle = tree.querySelector('.project-tree-toggle');
      toggle?.setAttribute('aria-expanded', String(expandedProjects.has(projectId)));
      button.draggable = true;
      button.title = `${project.name} · ${subtitle}；拖动可调整顺序`;
      const environmentList = tree.querySelector('.project-environment-list');
      const orderedEnvironments = environmentOrderForRender(projectId);
      if (environmentList) environmentList.innerHTML = orderedEnvironments.map((environment, environmentIndex) => {
        const runtime = store.runtimes[environment.environmentId] || { phase: 'disconnected', eligibleCount: 0, connectedCount: 0 };
        const counts = environmentCounts(environment.environmentId);
        const isCurrent = projectId === activeId && !overviewActive && document.querySelector(`#environmentTabs [data-environment-id="${CSS.escape(environment.environmentId)}"]`)?.classList.contains('active');
        const issue = environmentIssue(runtime);
        const status = `${environmentStatusText(runtime, counts)}${issue ? ` · ${issue}` : ''}`;
        const environmentTitle = `${environment.name} · ${status}；拖动可调整顺序`;
        return `<div class="project-environment-row ${isCurrent ? 'active' : ''}" data-state="${escapeAttr(runtime.phase || 'disconnected')}" data-sort-environment-row="${escapeAttr(environment.environmentId)}"><button class="project-environment-open" draggable="true" data-rail-project-id="${escapeAttr(projectId)}" data-rail-environment-id="${escapeAttr(environment.environmentId)}" title="${escapeAttr(environmentTitle)}"><span>${escapeHtml(environment.name)}</span><small>${escapeHtml(status)}</small></button>${railEnvironmentAction(projectId, environment, runtime, counts)}</div>`;
      }).join('');
    });
    updateRailConnectionSummary();
  }

  function projectOverviewSummary(projectId) {
    const summary = projectSummary(projectId);
    const parts = [`${summary.environments} 个环境`];
    if (summary.connected) parts.push(`${summary.connected} 个已连接`);
    if (summary.attention + summary.reconnecting) parts.push(`${summary.attention + summary.reconnecting} 个需处理`);
    if (summary.draft) parts.push(`${summary.draft} 个插件待完善`);
    if (parts.length === 1) parts.push('当前均未连接');
    return parts.join(' · ');
  }

  function environmentResourceText(counts) {
    const parts = [];
    if (counts.server) parts.push(`Server ${counts.server}`);
    if (counts.mysql) parts.push(`MySQL ${counts.mysql}`);
    if (counts.redis) parts.push(`Redis ${counts.redis}`);
    if (counts.draft) parts.push(`${counts.draft} 个待完善`);
    return parts.join(' · ') || '尚未添加插件';
  }

  function environmentStatusText(runtime, counts) {
    const connected = runtime?.connectedCount || 0;
    const eligible = runtime?.eligibleCount || 0;
    if (!eligible && counts.draft) return `${counts.draft} 个插件待完善`;
    if (!eligible) return '尚未添加插件';
    if (runtime?.phase === 'connected') return `${connected}/${eligible} 已连接`;
    if (runtime?.phase === 'partial') return `${connected}/${eligible} 已连接`;
    if (runtime?.phase === 'failed') return `0/${eligible} 连接失败`;
    if (runtime?.phase === 'connecting') return `连接中 ${connected}/${eligible}`;
    if (runtime?.phase === 'reconnecting') return `重连中 ${connected}/${eligible}`;
    if (runtime?.phase === 'disconnecting') return '正在断开';
    return '未连接';
  }

  function overviewActions(environment, runtime, counts) {
    const environmentId = escapeAttr(environment.environmentId);
    const enter = `<button class="button small" data-overview-enter="${environmentId}">打开</button>`;
    if (!runtime?.eligibleCount && counts.draft) return `${enter}<button class="button small primary" data-overview-complete="${environmentId}">完善配置</button>`;
    if (!runtime?.eligibleCount) return `${enter}<button class="button small primary" data-overview-add="${environmentId}">添加插件</button>`;
    if (runtime.phase === 'connected') return `${enter}<button class="button small" data-overview-runtime="disconnect" data-runtime-environment-id="${environmentId}">断开</button>`;
    if (runtime.phase === 'connecting') return `${enter}<button class="button small" data-overview-runtime="cancel" data-runtime-environment-id="${environmentId}">取消</button>`;
    if (runtime.phase === 'disconnecting') return `${enter}<button class="button small" disabled>断开中</button>`;
    if (runtime.phase === 'reconnecting') return `${enter}<button class="button small" data-overview-runtime="disconnect" data-runtime-environment-id="${environmentId}">断开</button>`;
    if (runtime.desiredConnected && ['partial','failed'].includes(runtime.phase)) return `${enter}<button class="button small primary" data-overview-runtime="retry" data-runtime-environment-id="${environmentId}">重试失败项</button><button class="text-button" data-overview-runtime="disconnect" data-runtime-environment-id="${environmentId}">断开</button>`;
    return `${enter}<button class="button small primary" data-overview-runtime="connect" data-runtime-environment-id="${environmentId}">连接环境</button>`;
  }

  function renderOverview() {
    ensureOverviewControls();
    const projectId = activeProjectId();
    const project = projectById(projectId);
    if (!overviewActive || !project) return;
    const app = document.querySelector('#app');
    app.classList.add('prototype-overview-active');
    document.querySelector('#projectOverviewTab')?.classList.add('active');
    document.querySelectorAll('#environmentTabs .environment-tab').forEach((item) => item.classList.remove('active'));
    let view = document.querySelector('#projectOverviewView');
    if (!view) {
      view = document.createElement('section');
      view.id = 'projectOverviewView';
      view.className = 'view project-overview-view';
      document.querySelector('.workspace').appendChild(view);
    }
    view.classList.remove('hidden');
    const environmentItems = store.environments[projectId] || [];
    view.innerHTML = `<div class="project-overview-shell"><header class="project-overview-head"><div><h1>环境概览</h1><p>${escapeHtml(projectOverviewSummary(projectId))}</p></div></header><div class="environment-overview-list">${environmentItems.map((environment) => {
      const runtime = store.runtimes[environment.environmentId] || { phase: 'disconnected', eligibleCount: 0, connectedCount: 0 };
      const counts = environmentCounts(environment.environmentId);
      const issue = environmentIssue(runtime);
      return `<article class="environment-overview-row" data-overview-environment="${escapeAttr(environment.environmentId)}" data-state="${escapeAttr(runtime.phase || 'disconnected')}"><div class="environment-overview-main"><div><button class="overview-environment-link" data-overview-enter="${escapeAttr(environment.environmentId)}">${escapeHtml(environment.name)}</button><p>${escapeHtml(environmentResourceText(counts))}</p></div></div><div class="environment-overview-state" data-state="${escapeAttr(runtime.phase || 'disconnected')}"><strong>${escapeHtml(environmentStatusText(runtime, counts))}</strong></div>${issue ? `<p class="environment-overview-issue">${escapeHtml(issue)}</p>` : ''}<div class="environment-overview-actions">${overviewActions(environment, runtime, counts)}</div></article>`;
    }).join('')}</div></div>`;
    decorateProjectRail();
  }

  function leaveOverview() {
    if (!overviewActive) return;
    overviewActive = false;
    document.querySelector('#app')?.classList.remove('prototype-overview-active');
    document.querySelector('#projectOverviewTab')?.classList.remove('active');
    document.querySelector('#projectOverviewView')?.classList.add('hidden');
  }

  function beginProjectSort() {
    if (projectSortMode || projectSortSaving) return false;
    projectSortMode = true;
    projectSortOriginal = [...projectOrderForRender()];
    projectSortDraft = [...projectSortOriginal];
    environmentSortOriginal = new Map();
    environmentSortDraft = new Map();
    store.projects.forEach((project) => {
      const ids = (store.environments[project.projectId] || []).map((item) => item.environmentId);
      environmentSortOriginal.set(project.projectId, [...ids]);
      environmentSortDraft.set(project.projectId, [...ids]);
    });
    return true;
  }

  function finishProjectSortUi() {
    projectSortMode = false;
    projectSortSaving = false;
    draggedSortItem = null;
    document.querySelectorAll('.sort-drop-before,.sort-drop-after').forEach((item) => item.classList.remove('sort-drop-before', 'sort-drop-after'));
    decorateProjectRail();
  }

  function cancelProjectSort() {
    if (!projectSortMode || projectSortSaving) return;
    projectSortDraft = [...projectSortOriginal];
    environmentSortDraft = new Map([...environmentSortOriginal].map(([projectId, ids]) => [projectId, [...ids]]));
    finishProjectSortUi();
  }

  async function saveProjectSort() {
    if (!projectSortMode || projectSortSaving) return;
    projectSortSaving = true;
    updateRailConnectionSummary();
    try {
      if (!store.api.reorderWorkspace) throw new Error('当前版本不支持原子排序保存');
      const environmentIdsByProject = Object.fromEntries(store.projects.map((project) => [
        project.projectId,
        [...(environmentSortDraft.get(project.projectId) || [])],
      ]));
      const result = await store.api.reorderWorkspace({ projectIds: [...projectSortDraft], environmentIdsByProject });
      if (!result?.ok) throw new Error(result?.error?.message || '侧边栏排序保存失败');
      committedProjectOrder = normalizeProjectOrder(projectSortDraft);
      projectSortNotice = { message: '顺序已保存', error: false };
      finishProjectSortUi();
      showProjectSortNotice('顺序已保存');
    } catch (error) {
      committedProjectOrder = normalizeProjectOrder(projectSortOriginal);
      projectSortDraft = [...projectSortOriginal];
      environmentSortDraft = new Map([...environmentSortOriginal].map(([projectId, ids]) => [projectId, [...ids]]));
      projectSortMode = false;
      projectSortSaving = false;
      decorateProjectRail();
      showProjectSortNotice(`${error.message}，已恢复原顺序`, true);
    }
  }

  function applyDroppedSortItem(targetKind, targetId, targetProjectId, after) {
    if (!draggedSortItem || draggedSortItem.kind !== targetKind) return false;
    if (targetKind === 'environment' && draggedSortItem.projectId !== targetProjectId) return false;
    let changed = false;
    if (targetKind === 'project') {
      const next = moveBeforeOrAfter(projectSortDraft, draggedSortItem.id, targetId, after);
      changed = !sameOrder(next, projectSortDraft);
      projectSortDraft = next;
    } else {
      const ids = environmentSortDraft.get(targetProjectId) || [];
      const next = moveBeforeOrAfter(ids, draggedSortItem.id, targetId, after);
      changed = !sameOrder(next, ids);
      environmentSortDraft.set(targetProjectId, next);
    }
    if (!changed) return false;
    const movedName = targetKind === 'project' ? projectById(draggedSortItem.id)?.name : environmentById(targetProjectId, draggedSortItem.id)?.name;
    document.querySelector('#projectSortLive').textContent = `已移动${movedName || '项目'}`;
    decorateProjectRail();
    return true;
  }

  async function waitForSelector(selector, timeout = 1500) {
    const started = Date.now();
    while (Date.now() - started < timeout) {
      const item = document.querySelector(selector);
      if (item) return item;
      await wait(25);
    }
    return null;
  }

  function scheduleProjectRailDecoration() {
    requestAnimationFrame(() => requestAnimationFrame(decorateProjectRail));
    window.setTimeout(decorateProjectRail, 160);
  }

  async function openEnvironment(projectId, environmentId, options = {}) {
    leaveOverview();
    openingEnvironment = true;
    try {
      const projectButton = document.querySelector(`.rail-button[data-project-id="${CSS.escape(projectId)}"]`);
      if (!projectButton) return;
      if (!projectButton.classList.contains('active')) projectButton.click();
      let environmentTab = await waitForSelector(`#environmentTabs [data-environment-id="${CSS.escape(environmentId)}"]`);
      if (!environmentTab) {
        document.querySelector('#moreEnvironments')?.click();
        environmentTab = await waitForSelector(`[data-select-environment="${CSS.escape(environmentId)}"],[data-environment-id="${CSS.escape(environmentId)}"]`);
      }
      environmentTab?.click();
      if (options.pluginId) {
        const pluginButton = await waitForSelector(`.plugin-item[data-plugin-id="${CSS.escape(options.pluginId)}"]`);
        pluginButton?.click();
      }
    } finally {
      openingEnvironment = false;
      scheduleProjectRailDecoration();
    }
  }

  async function openProjectEnvironmentManager(projectId) {
    expandedProjects.add(projectId);
    const projectButton = document.querySelector(`.rail-button[data-project-id="${CSS.escape(projectId)}"]`);
    if (!projectButton) return;
    if (!projectButton.classList.contains('active')) {
      projectButton.click();
      const started = Date.now();
      while (activeProjectId() !== projectId && Date.now() - started < 2500) await wait(25);
    }
    if (activeProjectId() !== projectId) return;
    decorateProjectRail();
    const dialog = document.querySelector('#environmentManagerDialog');
    if (dialog) dialog.dataset.managedProjectId = projectId;
    document.querySelector('#manageEnvironments')?.click();
  }

  async function handleRuntimeAction(action, environmentId) {
    if (action === 'connect') await store.api.connectEnvironment({ environmentId });
    else if (action === 'retry') await store.api.retryEnvironment({ environmentId });
    else if (action === 'cancel') await store.api.cancelEnvironment({ environmentId });
    else await store.api.disconnectEnvironment({ environmentId });
    decorateProjectRail();
    if (overviewActive) renderOverview();
  }

  document.addEventListener('click', async (event) => {
    if (Date.now() < suppressRailClickUntil && event.target.closest('.rail-button[data-project-id],.project-environment-open')) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    const projectEnvironmentManager = event.target.closest('[data-manage-project-environments]');
    if (projectEnvironmentManager) {
      event.preventDefault();
      event.stopImmediatePropagation();
      await openProjectEnvironmentManager(projectEnvironmentManager.dataset.manageProjectEnvironments);
      return;
    }
    const projectTreeToggle = event.target.closest('[data-toggle-project-tree]');
    if (projectTreeToggle) {
      event.preventDefault();
      event.stopImmediatePropagation();
      const projectId = projectTreeToggle.dataset.toggleProjectTree;
      if (expandedProjects.has(projectId)) expandedProjects.delete(projectId);
      else expandedProjects.add(projectId);
      decorateProjectRail();
      return;
    }
    const railRuntime = event.target.closest('[data-rail-runtime]');
    if (railRuntime) {
      event.preventDefault();
      event.stopImmediatePropagation();
      railRuntime.disabled = true;
      await handleRuntimeAction(railRuntime.dataset.railRuntime, railRuntime.dataset.railActionEnvironmentId);
      return;
    }
    const railComplete = event.target.closest('[data-rail-complete]');
    if (railComplete) {
      event.preventDefault();
      event.stopImmediatePropagation();
      const environmentId = railComplete.dataset.railActionEnvironmentId;
      const draft = (store.plugins[environmentId] || []).find((plugin) => plugin.configState !== 'ready');
      await openEnvironment(railComplete.dataset.railProjectId, environmentId, { pluginId: draft?.pluginInstanceId });
      return;
    }
    const railAdd = event.target.closest('[data-rail-add]');
    if (railAdd) {
      event.preventDefault();
      event.stopImmediatePropagation();
      await openEnvironment(railAdd.dataset.railProjectId, railAdd.dataset.railActionEnvironmentId);
      document.querySelector('#addPlugin')?.click();
      return;
    }
    const railEnvironment = event.target.closest('[data-rail-environment-id]');
    if (railEnvironment) {
      event.preventDefault();
      event.stopImmediatePropagation();
      expandedProjects.add(railEnvironment.dataset.railProjectId);
      await openEnvironment(railEnvironment.dataset.railProjectId, railEnvironment.dataset.railEnvironmentId);
      return;
    }
    const environmentTab = event.target.closest('#environmentTabs .environment-tab');
    if (environmentTab) { leaveOverview(); return; }
    const projectButton = event.target.closest('.rail-button[data-project-id]');
    if (projectButton) {
      expandedProjects.add(projectButton.dataset.projectId);
      if (!openingEnvironment) {
        overviewActive = true;
        requestAnimationFrame(() => requestAnimationFrame(renderOverview));
      }
    }
    const enter = event.target.closest('[data-overview-enter]');
    if (enter) { await openEnvironment(activeProjectId(), enter.dataset.overviewEnter); return; }
    const complete = event.target.closest('[data-overview-complete]');
    if (complete) {
      const environmentId = complete.dataset.overviewComplete;
      const draft = (store.plugins[environmentId] || []).find((plugin) => plugin.configState !== 'ready');
      await openEnvironment(activeProjectId(), environmentId, { pluginId: draft?.pluginInstanceId });
      return;
    }
    const add = event.target.closest('[data-overview-add]');
    if (add) {
      await openEnvironment(activeProjectId(), add.dataset.overviewAdd);
      document.querySelector('#addPlugin')?.click();
      return;
    }
    const runtimeAction = event.target.closest('[data-overview-runtime]');
    if (runtimeAction) { runtimeAction.disabled = true; await handleRuntimeAction(runtimeAction.dataset.overviewRuntime, runtimeAction.dataset.runtimeEnvironmentId); return; }
  }, true);

  document.addEventListener('dragstart', (event) => {
    if (projectSortSaving) {
      event.preventDefault();
      return;
    }
    const project = event.target.closest('.rail-button[data-project-id]');
    const environment = event.target.closest('.project-environment-open[data-rail-environment-id]');
    if (!project && !environment) return;
    if (!beginProjectSort()) {
      event.preventDefault();
      return;
    }
    if (project) draggedSortItem = { kind: 'project', id: project.dataset.projectId, projectId: '' };
    else if (environment) draggedSortItem = { kind: 'environment', id: environment.dataset.railEnvironmentId, projectId: environment.dataset.railProjectId };
    suppressRailClickUntil = Number.POSITIVE_INFINITY;
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', `${draggedSortItem.kind}:${draggedSortItem.id}`);
    event.target.closest('.project-tree-item,.project-environment-row')?.classList.add('sort-dragging');
  });

  document.addEventListener('dragover', (event) => {
    if (!projectSortMode || !draggedSortItem) return;
    const target = draggedSortItem.kind === 'project'
      ? event.target.closest('.project-tree-item')
      : event.target.closest('.project-environment-row');
    if (!target) return;
    const targetProjectId = target.closest('.project-tree-item')?.dataset.treeProject || '';
    if (draggedSortItem.kind === 'environment' && targetProjectId !== draggedSortItem.projectId) return;
    event.preventDefault();
    document.querySelectorAll('.sort-drop-before,.sort-drop-after').forEach((item) => item.classList.remove('sort-drop-before', 'sort-drop-after'));
    const after = event.clientY > target.getBoundingClientRect().top + target.getBoundingClientRect().height / 2;
    target.classList.add(after ? 'sort-drop-after' : 'sort-drop-before');
    event.dataTransfer.dropEffect = 'move';
  });

  document.addEventListener('drop', (event) => {
    if (!projectSortMode || !draggedSortItem) return;
    const target = draggedSortItem.kind === 'project'
      ? event.target.closest('.project-tree-item')
      : event.target.closest('.project-environment-row');
    if (!target) return;
    const targetProjectId = target.closest('.project-tree-item')?.dataset.treeProject || '';
    if (draggedSortItem.kind === 'environment' && targetProjectId !== draggedSortItem.projectId) return;
    event.preventDefault();
    const targetId = draggedSortItem.kind === 'project' ? target.dataset.treeProject : target.dataset.sortEnvironmentRow;
    const after = target.classList.contains('sort-drop-after');
    const changed = applyDroppedSortItem(draggedSortItem.kind, targetId, targetProjectId, after);
    draggedSortItem = null;
    document.querySelectorAll('.sort-dragging,.sort-drop-before,.sort-drop-after').forEach((item) => item.classList.remove('sort-dragging', 'sort-drop-before', 'sort-drop-after'));
    if (changed) void saveProjectSort();
    else cancelProjectSort();
  });

  document.addEventListener('dragend', () => {
    draggedSortItem = null;
    suppressRailClickUntil = Date.now() + 120;
    document.querySelectorAll('.sort-dragging,.sort-drop-before,.sort-drop-after').forEach((item) => item.classList.remove('sort-dragging', 'sort-drop-before', 'sort-drop-after'));
    if (projectSortMode && !projectSortSaving) cancelProjectSort();
  });

  window.addEventListener('load', () => {
    ensureOverviewControls();
    decorateProjectRail();
    window.setTimeout(() => {
      if (!activeProjectId() || overviewActive) return;
      overviewActive = true;
      renderOverview();
    }, 120);
    const projectList = document.querySelector('#projectList');
    const tabs = document.querySelector('#environmentTabs');
    if (projectList) new MutationObserver(scheduleProjectRailDecoration).observe(projectList, { childList: true });
    if (tabs) new MutationObserver(() => {
      ensureOverviewControls();
      if (overviewActive) requestAnimationFrame(renderOverview);
    }).observe(tabs, { childList: true });
    store.api.onEnvironmentStatus(() => {
      requestAnimationFrame(() => {
        decorateProjectRail();
        if (overviewActive) renderOverview();
      });
    });
  });
})();
</script>
</body>
</html>
