name: 功能建议
description: 建议一个新的使用场景或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 对权限或安全边界的影响
      description: 如果没有影响，请填写“无”。
    validations:
      required: true
