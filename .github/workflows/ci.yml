name: CI
on:
  push:
    branches:
      - main
      - codex/macos-support
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            app: dist/win-unpacked/Agent运维工作台.exe
          - os: macos-15
            platform: darwin
            arch: arm64
            app: dist/mac-arm64/Agent运维工作台.app
          - os: macos-15-intel
            platform: darwin
            arch: x64
            app: dist/mac/Agent运维工作台.app
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install Electron runtime
        run: corepack pnpm run install:electron-runtime
      - name: Verify Electron runtime
        run: corepack pnpm exec electron --version
      - name: Syntax and type checks
        run: corepack pnpm run check
      - name: Automated tests
        run: corepack pnpm test
      - name: Production React UI workflow smoke test
        run: |-
          failed=0
          for suite in test:ui test:ui:business test:ui:plugins test:ui:plugin-matrix test:ui:server-workspace test:ui:database; do
            corepack pnpm run "$suite" || failed=1
          done
          exit "$failed"
        env:
          RUNBOOK_BRIDGE_SCREENSHOT_DIR: ${{ runner.temp }}/runbook-bridge-ui-${{ matrix.platform }}-${{ matrix.arch }}
      - name: Build Windows test package
        if: runner.os == 'Windows'
        run: corepack pnpm run dist
      - name: Build macOS test package
        if: runner.os == 'macOS'
        run: corepack pnpm run dist:mac:${{ matrix.arch }}
      - name: Verify packaged application
        run: |-
          node scripts/verify-package.mjs "${{ matrix.app }}"
          node scripts/packaged-mcp-smoke.mjs "${{ matrix.app }}"
          node scripts/packaged-ui-smoke.cjs "${{ matrix.app }}"
      - name: Verify Windows install and overwrite upgrade
        if: runner.os == 'Windows'
        run: node scripts/install-upgrade-regression.cjs
      - name: Verify macOS install and overwrite upgrade
        if: runner.os == 'macOS'
        run: |-
          VERSION=$(node -p "require('./package.json').version")
          node scripts/install-upgrade-regression.cjs "dist/RunbookBridge-${VERSION}-mac-${{ matrix.arch }}.dmg"
      - name: Retain validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain UI parity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-parity-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/runbook-bridge-ui-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 7
