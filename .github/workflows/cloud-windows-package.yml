name: Cloud Windows package
on:
  workflow_dispatch: null
  push:
    branches: [main]
    paths:
      - docs/releases/v*.md
      - .github/workflows/cloud-windows-package.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies and Electron
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm run install:electron-runtime
      - name: Syntax, types and unit tests
        run: |
          corepack pnpm run check
          corepack pnpm test
      - name: Markdown, recovery, settings and update center UI
        run: |
          corepack pnpm run test:ui:runbook
          corepack pnpm exec electron scripts/ui-react-business-smoke.cjs --recovery-only
          corepack pnpm exec electron scripts/ui-react-foundation-smoke.cjs --settings-regression-only
          corepack pnpm exec electron scripts/ui-react-foundation-smoke.cjs --update-center-only
      - name: Build Windows x64 installer
        run: corepack pnpm run dist
      - name: Verify packaged application
        run: |
          node scripts/verify-package.mjs "dist/win-unpacked/Agent运维工作台.exe"
          node scripts/packaged-mcp-smoke.mjs "dist/win-unpacked/Agent运维工作台.exe"
          node scripts/packaged-ui-smoke.cjs "dist/win-unpacked/Agent运维工作台.exe"
      - name: Verify installation and overwrite upgrade in an encoded path
        run: node scripts/install-upgrade-regression.cjs
      - name: Prepare cloud update files
        run: |
          node scripts/prepare-cloud-update.mjs --platform win32 --arch x64
          cp build/runtime.json artifacts/cloud-updates/runtime.json
      - name: Retain verified cloud update
        uses: actions/upload-artifact@v4
        with:
          name: cloud-updates-win32-x64
          path: artifacts/cloud-updates/
          if-no-files-found: error
          retention-days: 14
