name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify release tag matches package version
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-release-version.mjs "$env:RELEASE_REF_NAME"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm run install:electron-runtime

      - name: Verify Electron runtime
        run: node_modules/electron/dist/electron.exe --version

      - name: Test
        run: |
          pnpm run check
          pnpm test
          pnpm run test:ui:all

      - name: Build Windows installer
        run: pnpm run dist

      - name: Verify packaged application
        run: |
          node scripts/verify-package.mjs "dist/win-unpacked/Agent运维工作台.exe"
          node scripts/packaged-mcp-smoke.mjs "dist/win-unpacked/Agent运维工作台.exe"
          node scripts/packaged-ui-smoke.cjs "dist/win-unpacked/Agent运维工作台.exe"

      - name: Verify clean install and in-place upgrade
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter "Agent运维工作台 Setup *.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          node scripts/install-upgrade-regression.cjs $installer.FullName

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter "Agent运维工作台 Setup *.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $releaseInstaller = Join-Path $installer.DirectoryName "RunbookBridge-Setup-$($env:GITHUB_REF_NAME.TrimStart('v')).exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $releaseInstaller
          $checksumPath = "$releaseInstaller.sha256"
          $checksum = (Get-FileHash -LiteralPath $releaseInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $(Split-Path -Leaf $releaseInstaller)" | Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM
          $releaseArgs = @('release', 'create', $env:GITHUB_REF_NAME, $releaseInstaller, $checksumPath, '--verify-tag', '--generate-notes', '--title', $env:GITHUB_REF_NAME)
          if ($env:GITHUB_REF_NAME.Contains('-')) {
            $releaseArgs += @('--prerelease', '--latest=false', '--notes', '服务器工作区预发布版本，供体验与反馈；日常使用请选择 README 中的稳定版，试用前备份本地数据。')
          } else {
            $releaseArgs += @('--latest', '--notes', '稳定版本。安装与使用方法请参阅 README，下载 .exe 安装包即可使用。')
          }
          gh release view $env:GITHUB_REF_NAME --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release already exists; preserving its published assets and notes."
            exit 0
          }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
