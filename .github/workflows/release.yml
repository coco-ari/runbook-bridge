name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm run install:electron-runtime

      - name: Verify Electron runtime
        run: node_modules/electron/dist/electron.exe --version

      - name: Test
        run: |
          pnpm run check
          pnpm test

      - name: Build Windows installer
        run: pnpm run dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter "AI运维工具 Setup *.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          gh release create $env:GITHUB_REF_NAME $installer.FullName --generate-notes --title $env:GITHUB_REF_NAME
